# Host Apache: TLS terminator in front of the HTTP Docker backend.
# Installed as conf-available/goum-proxy-tls.conf (site-specific; safe beside other vhosts).
#
# Rewrite absolute http:// Location redirects from the container back to https
# when the client connected over TLS. Also send HSTS on HTTPS responses.

<IfModule mod_headers.c>
  Header edit Location ^http:// https:// "expr=%{HTTPS} == 'on'"
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" "expr=%{HTTPS} == 'on'"
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
