# Host Apache vhost for Ubuntu apache2 (24.04 / 26.04).
# Proxies public traffic to the Goum Docker container (nginx on loopback).
#
# Installed by: make deploy
# HTTPS via:    make certbot  (or included by make deploy when CERTBOT_EMAIL is set)
#
# install-host-apache.sh picks one of the two HTTP modes below:
#   - bootstrap: proxy cleartext (only before certificates exist)
#   - secure:    301 to HTTPS (default once /etc/letsencrypt/live/<domain> exists)

# __GOUM_HTTP_MODE_SECURE_BEGIN__
<VirtualHost *:80>
  ServerName goum.eu
  ServerAlias www.goum.eu

  RewriteEngine On
  RewriteRule ^/\.well-known/acme-challenge/ - [L]
  RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

  ErrorLog ${APACHE_LOG_DIR}/goum.eu-error.log
  CustomLog ${APACHE_LOG_DIR}/goum.eu-access.log combined
</VirtualHost>
# __GOUM_HTTP_MODE_SECURE_END__

# __GOUM_HTTP_MODE_BOOTSTRAP_BEGIN__
<VirtualHost *:80>
  ServerName goum.eu
  ServerAlias www.goum.eu

  ProxyPreserveHost On
  ProxyRequests Off
  RequestHeader set X-Forwarded-Proto "http"
  RequestHeader set X-Forwarded-Port "80"
  RequestHeader set X-Real-IP %{REMOTE_ADDR}s

  ProxyPass / http://127.0.0.1:8090/
  ProxyPassReverse / http://127.0.0.1:8090/
  ProxyPassReverse / http://goum.eu/
  ProxyPassReverse / https://goum.eu/
  ProxyPassReverse / http://www.goum.eu/
  ProxyPassReverse / https://www.goum.eu/

  ErrorLog ${APACHE_LOG_DIR}/goum.eu-error.log
  CustomLog ${APACHE_LOG_DIR}/goum.eu-access.log combined
</VirtualHost>
# __GOUM_HTTP_MODE_BOOTSTRAP_END__
