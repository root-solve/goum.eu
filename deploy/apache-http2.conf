# Enable HTTP/2 for TLS clients (ALPN "h2").
# Host Apache terminates HTTPS; the Docker backend stays HTTP/1.1 on loopback.
#
# Installed by deploy/install-host-apache.sh → /etc/apache2/conf-available/http2.conf
# Requires: a2enmod http2 ssl  and an event/worker MPM (not prefork).

Protocols h2 http/1.1
