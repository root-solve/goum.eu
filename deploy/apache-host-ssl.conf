# HTTPS vhost — installed as sites-available/<domain>-le-ssl.conf when certs exist.
# Always proxies to Docker (do not rely on Certbot copying the HTTP vhost).

<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName goum.eu
  ServerAlias www.goum.eu

  SSLEngine on
  SSLCertificateFile /etc/letsencrypt/live/goum.eu/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/goum.eu/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf

  ProxyPreserveHost On
  ProxyRequests Off
  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Port "443"
  RequestHeader set X-Real-IP %{REMOTE_ADDR}s

  ProxyPass / http://127.0.0.1:8090/
  ProxyPassReverse / http://127.0.0.1:8090/
  ProxyPassReverse / http://goum.eu/
  ProxyPassReverse / https://goum.eu/
  ProxyPassReverse / http://www.goum.eu/
  ProxyPassReverse / https://www.goum.eu/

  ErrorLog ${APACHE_LOG_DIR}/goum.eu-ssl-error.log
  CustomLog ${APACHE_LOG_DIR}/goum.eu-ssl-access.log combined
</VirtualHost>
</IfModule>
