services:
  web:
    build: .
    container_name: goum-eu
    ports:
      # Behind Apache: HTTP_BIND=127.0.0.1 (set by make deploy)
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8090}:80"
    volumes:
      # Live source + music: edit/add files on the host, no restart needed
      - ./www:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    build: ./api
    container_name: goum-api
    # Not published to the host — only reachable via the web proxy on the Docker network
    expose:
      - "8080"
    env_file:
      - .env
    volumes:
      - ./www/mp3:/mp3:ro
    environment:
      MP3_DIR: /mp3
      PORT: "8080"
      CONTACT_MAIL: ${CONTACT_MAIL:-}
      CONTACT_PHONE: ${CONTACT_PHONE:-}
      YOUTUBE_URL: ${YOUTUBE_URL:-}
      DOMAIN: ${DOMAIN:-goum.eu}
      SITE_URL: ${SITE_URL:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
